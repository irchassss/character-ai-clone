name: Автосборка Android APK 📱

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Сборка тестового APK
    runs-on: ubuntu-latest

    steps:
    - name: Скачивание репозитория
      uses: actions/checkout@v4

    - name: Установка JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Подготовка и исправление структуры Android проекта
      run: |
        mkdir -p app/src/main/java/com/example/characterai
        mkdir -p app/src/main/res/values
        
        # Список всех наших файлов интерфейса
        declare -a files=(
          "MainActivity.txt" "FeedScreen.txt" "ChatsScreen.txt" 
          "ChatDetailScreen.txt" "VoiceCallScreen.txt" "VoiceManager.txt" 
          "CreateCharacterScreen.txt" "RecommendationsScreen.txt" 
          "ProfileScreen.txt" "MainNavigation.txt" "BattleScreen.txt"
        )

        # Автоматически добавляем заголовок пакета в начало каждого файла Kotlin и заменяем расширение
        for f in "${files[@]}"; do
          if [ -f "$f" ]; then
            name="${f%.txt}"
            echo "package com.example.characterai" > "app/src/main/java/com/example/characterai/${name}.kt"
            echo "" >> "app/src/main/java/com/example/characterai/${name}.kt"
            
            # Исправляем мелкие опечатки типов данных (str -> String)
            cat "$f" | sed 's/: str/: String/g' >> "app/src/main/java/com/example/characterai/${name}.kt"
          fi
        done

        # Создаем правильный манифест AndroidManifest.xml
        cat <<EOF > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://android.com">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <application
                android:allowBackup="true"
                android:label="Character AI Clone"
                android:icon="@android:drawable/sym_def_app_icon"
                android:theme="@android:style/Theme.Material.NoActionBar">
                <activity
                    android:name="com.example.characterai.MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # Создаем файл базовых пустых стилей ресурсов
        cat <<EOF > app/src/main/res/values/themes.xml
        <resources></resources>
        EOF

        # Автоматически генерируем Gradle Wrapper, чтобы сервер знал, как запускать ./gradlew
        gradle wrapper --gradle-version 8.2 --validate-url

    - name: Сборка Debug APK через Gradle Сборщик
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Сохранение и публикация готового APK файла
      uses: actions/upload-artifact@v4
      with:
        name: CharacterAI-Clone-App
        path: app/build/outputs/apk/debug/app-debug.apk
